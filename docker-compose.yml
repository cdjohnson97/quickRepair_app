# FiXeo — lancer l'API NestJS et le front web dans Docker.
#   docker compose up --build -d     # démarrer
#   docker compose logs -f api       # suivre les logs de l'API
#   docker compose down              # arrêter
# Prérequis : server/.env (npm run env:decrypt dans server/).
# Front : http://localhost:8080 · API : http://localhost:3000/api
# Ports déjà pris ? ex. PowerShell : $env:API_PORT=3001; docker compose up --build -d

name: fixeo

services:
  api:
    build: ./server
    image: fixeo-api
    env_file:
      - ./server/.env
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:${API_PORT:-3000}/api
    image: fixeo-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
